name: CI

# Pushes to main and dev, plus pull requests into them. Other branches run
# only through their pull request (in practice Dependabot's), so each commit
# is tested once; the automerge workflow acts only on the pull request run.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # SEC-002 through SEC-005. Delegates to the fleet's shared security
  # workflow: gitleaks over full history, pnpm audit against the resolved
  # dependency set, semgrep, and a CycloneDX SBOM retained as a build
  # artifact. The steps live in mini-app-polis/.github so the pinned tool
  # versions and the gating decisions are in one place; see that repo's
  # README for the inputs.
  security:
    uses: mini-app-polis/.github/.github/workflows/security.yml@v3
    with:
      language: typescript
      package-manager: pnpm

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:coverage
      - run: pnpm build

  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [test, security]
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # semantic-release and its plugins only ever run here, so they are
      # installed for this step rather than declared in package.json: kept
      # out of the lockfile, their transitive dependencies (braces,
      # GHSA-vfj7-8cjw-p6xm, among them) are not part of what the security
      # scan grades. The app's own dependencies are not needed to release.
      - name: Release
        run: >-
          npx --yes
          -p semantic-release@25
          -p @semantic-release/changelog@7
          -p @semantic-release/commit-analyzer@13
          -p @semantic-release/git@11
          -p @semantic-release/github@12
          -p @semantic-release/npm@13
          -p @semantic-release/release-notes-generator@14
          semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # CD-031. A release requests its own conformance evaluation through the
  # fleet's shared workflow, so this repo's findings move with its code
  # rather than waiting for the next standards or evaluator release.
  evaluate:
    needs: release
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: mini-app-polis/.github/.github/workflows/evaluate.yml@v3
    secrets:
      api-key: ${{ secrets.CI_VALIDATOR_API_KEY }}