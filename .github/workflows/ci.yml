name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install

      # SEC-003: Dependency vulnerability scan — fail the build if pnpm audit finds issues
      - name: Audit dependencies
        run: pnpm audit --audit-level=moderate

      # SEC-002: Secret scanning on pull-request diffs using gitleaks
      - name: Scan for secrets (PR diffs)
        if: github.event_name == 'pull_request'
        uses: gitleaks/gitleaks-action@v2
        with:
          source: diff
          verbose: true

      # SEC-002: Full gitleaks scan on push to main
      - name: Scan for secrets (full history)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: gitleaks/gitleaks-action@v2
        with:
          verbose: true

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm -r test:coverage
      - run: pnpm --filter api build
      - run: pnpm --filter app build

  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install
      - name: Release
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
