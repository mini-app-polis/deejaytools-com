name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  # SEC-002 through SEC-005. Delegates to the fleet's shared security
  # workflow: gitleaks over full history, pnpm audit against the resolved
  # dependency set, semgrep, and a CycloneDX SBOM retained as a build
  # artifact. The steps live in mini-app-polis/.github so the pinned tool
  # versions and the gating decisions are in one place; see that repo's
  # README for the inputs.
  security:
    uses: mini-app-polis/.github/.github/workflows/security.yml@v2
    with:
      language: typescript
      package-manager: pnpm

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm -r test:coverage
      - run: pnpm --filter api build
      - run: pnpm --filter app build

  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [verify, security]
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install
      - name: Release
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
