name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install

      # SEC-002: Secret scanning on pull-request diffs using gitleaks.
      # Runs early: fast, deterministic, and a leaked credential should stop
      # the build before anything else is worth looking at.
      - name: Scan for secrets (PR diffs)
        if: github.event_name == 'pull_request'
        uses: gitleaks/gitleaks-action@v2
        with:
          source: diff
          verbose: true

      # SEC-002: Full gitleaks scan on push to main
      - name: Scan for secrets (full history)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: gitleaks/gitleaks-action@v2
        with:
          verbose: true

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm -r test:coverage
      - run: pnpm --filter api build
      - run: pnpm --filter app build

      # SEC-003: Dependency vulnerability scanning, split by blast radius.
      #
      # These run last because `pnpm audit` calls the npm registry over the
      # network on every invocation. A registry timeout is not a reason to
      # withhold typecheck, lint and test results.
      #
      # Hard gate on runtime dependencies — these ship to users of the app
      # and API, so a finding here is worth blocking a deploy for.
      - name: Audit runtime dependencies
        run: pnpm audit --prod --audit-level=moderate

      # Report-only on the full tree. Dev-only findings arrive through the
      # build and test toolchain, reach no user, and are frequently not
      # fixable by upgrading — current eslint still resolves a flagged
      # brace-expansion. Failing merges on them would leave CI permanently
      # red, which teaches everyone to ignore it. Surfaced to be read.
      - name: Audit all dependencies (informational)
        continue-on-error: true
        run: pnpm audit --audit-level=moderate

  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install
      - name: Release
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
