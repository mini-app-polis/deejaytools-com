name: CI

# Pushes to main and dev, plus pull requests into them. Other branches run
# only through their pull request (in practice Dependabot's), so each commit
# is tested once; the automerge workflow acts only on the pull request run.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # SEC-002 through SEC-005. Delegates to the fleet's shared security
  # workflow: gitleaks over full history, pnpm audit against the resolved
  # dependency set, semgrep, and a CycloneDX SBOM retained as a build
  # artifact. The steps live in mini-app-polis/.github so the pinned tool
  # versions and the gating decisions are in one place; see that repo's
  # README for the inputs.
  security:
    uses: mini-app-polis/.github/.github/workflows/security.yml@v3
    with:
      language: typescript
      package-manager: pnpm

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:coverage
      # The build compiles the app only with a Clerk publishable key: without
      # one, main.tsx throws before rendering and the bundler drops every page
      # as unreachable, so a page that fails to compile would still pass. The
      # key is a placeholder development-instance key for clerk.example.com,
      # built here rather than written out so secret scanners do not flag it;
      # this bundle is never deployed.
      - name: pnpm build
        run: DEEJAYTOOLS_CLERK_PUBLISHABLE_KEY="pk_test_$(printf 'clerk.example.com$' | base64)" pnpm build

  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [test, security]
    permissions:
      contents: write
      issues: write
      pull-requests: write
    # VER-006: semantic-release and its plugins from the fleet's shared lockfile.
    uses: mini-app-polis/.github/.github/workflows/release.yml@v3

  # CD-031. A release requests its own conformance evaluation through the
  # fleet's shared workflow, so this repo's findings move with its code
  # rather than waiting for the next standards or evaluator release.
  evaluate:
    needs: release
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: mini-app-polis/.github/.github/workflows/evaluate.yml@v3
    secrets:
      api-key: ${{ secrets.CI_VALIDATOR_API_KEY }}