name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # SEC-002 through SEC-005. Delegates to the fleet's shared security
  # workflow: gitleaks over full history, pnpm audit against the resolved
  # dependency set, semgrep, and a CycloneDX SBOM retained as a build
  # artifact. The steps live in mini-app-polis/.github so the pinned tool
  # versions and the gating decisions are in one place; see that repo's
  # README for the inputs.
  security:
    uses: mini-app-polis/.github/.github/workflows/security.yml@v3
    with:
      language: typescript
      package-manager: pnpm

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:coverage
      - run: pnpm build

      # The zod schemas are the API contract, and this repo holds one of
      # two copies (the other is deejaytools-api/src/schemas/index.ts). Both dev
      # branches must agree before either reaches main: a pull request to
      # main fails on any difference; a push to dev only warns, since one
      # side of a contract change always lands first.
      - name: Schemas match deejaytools-api@dev
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/dev'
        run: |
          curl -fsSL --retry 3 \
            "https://raw.githubusercontent.com/mini-app-polis/deejaytools-api/dev/src/schemas/index.ts" \
            -o "$RUNNER_TEMP/other.ts"
          # Lines 1-2 are each copy's header naming the other file.
          if diff -u <(tail -n +3 "$RUNNER_TEMP/other.ts") <(tail -n +3 src/schemas/index.ts); then
            echo "Schemas match deejaytools-api@dev."
          elif [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.base_ref }}" = "main" ]; then
            echo "::error::src/schemas/index.ts differs from deejaytools-api@dev. Land the same change there first."
            exit 1
          else
            echo "::warning::src/schemas/index.ts differs from deejaytools-api@dev. Make the same change there before merging to main."
          fi

  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [test, security]
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install
      - name: Release
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # CD-031. A release requests its own conformance evaluation through the
  # fleet's shared workflow, so this repo's findings move with its code
  # rather than waiting for the next standards or evaluator release.
  evaluate:
    needs: release
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: mini-app-polis/.github/.github/workflows/evaluate.yml@v3
    secrets:
      api-key: ${{ secrets.CI_VALIDATOR_API_KEY }}
