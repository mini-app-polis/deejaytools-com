name: Contract

# The live contract suite (src/contract): every endpoint in the web app's
# catalog, called against the development API and validated against the
# schemas the app relies on. It writes to that API, so it runs one at a
# time and only ever with a development Clerk key — see
# src/contract/harness.ts for the guards.
#
# Configuration (repository settings → Secrets and variables → Actions):
#   secret   CONTRACT_CLERK_SECRET_KEY   dev Clerk instance secret key (sk_test_…)
#   variable CONTRACT_API_URL           dev API base URL
#   variable CONTRACT_USER_ID           Clerk user id of the test user (an admin in dev)
#   variable CONTRACT_DANCER_USER_ID    Clerk user id of a plain user, linked as the admin's partner
#                                       (one-time setup: docs/DEPLOYMENT.md, "Linked partner for the test suites")
#   variable CONTRACT_STAFF_USER_ID     Clerk user id of a plain user the suite grants event staff roles to
# Missing configuration fails the run: an unconfigured suite checks nothing,
# and a green run must mean the contract was checked.
#
# This repository owns the API's live contract suite. The static half — the
# catalog against api-deejaytools' committed OpenAPI document — runs with the
# unit tests in CI (src/contract/apiSnapshot.test.ts).
#
# When it runs — whenever either side of the contract changes:
#   - a push to dev here: the web app's schemas or catalog changed;
#   - `dev-api-deployed`: api-deejaytools' deployed workflow sends this
#     once Railway reports a successful dev deploy, so the suite checks the
#     API that is actually live rather than the one it replaced.
# Not on the promotion pull request to main: its head is dev's latest
# commit, already checked by the push run, whose result the pull request
# shows.
# A repository_dispatch always runs this file from main, so that run checks
# out dev explicitly: it is dev's suite that should meet dev's API.

on:
  push:
    branches: [dev]
  repository_dispatch:
    types: [dev-api-deployed]
  workflow_dispatch:

concurrency:
  group: contract-dev-api
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CONTRACT_API_URL: ${{ vars.CONTRACT_API_URL }}
      CONTRACT_USER_ID: ${{ vars.CONTRACT_USER_ID }}
      CONTRACT_DANCER_USER_ID: ${{ vars.CONTRACT_DANCER_USER_ID }}
      CONTRACT_STAFF_USER_ID: ${{ vars.CONTRACT_STAFF_USER_ID }}
      CONTRACT_CLERK_SECRET_KEY: ${{ secrets.CONTRACT_CLERK_SECRET_KEY }}
    steps:
      - name: Check configuration
        run: |
          missing=""
          [ -n "$CONTRACT_API_URL" ] || missing="$missing CONTRACT_API_URL"
          [ -n "$CONTRACT_USER_ID" ] || missing="$missing CONTRACT_USER_ID"
          [ -n "$CONTRACT_DANCER_USER_ID" ] || missing="$missing CONTRACT_DANCER_USER_ID"
          [ -n "$CONTRACT_STAFF_USER_ID" ] || missing="$missing CONTRACT_STAFF_USER_ID"
          [ -n "$CONTRACT_CLERK_SECRET_KEY" ] || missing="$missing CONTRACT_CLERK_SECRET_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Contract suite not configured — set$missing."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'repository_dispatch' && 'dev' || '' }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:contract
