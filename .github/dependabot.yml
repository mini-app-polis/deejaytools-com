# Automated dependency updates.
#
# The fleet audits dependencies on every build (ecosystem-standards
# SEC-003), which finds what has gone vulnerable but never fixes it.
# Clearing those by hand does not scale — one repo needed 45 advisories
# closed in a single sitting. This is the other half: keep dependencies
# current so the audit has less to find.
#
# `commit-message.prefix` is load-bearing, not cosmetic. Dependabot's
# default subject is "Bump x from y to z", which is not a Conventional
# Commit. Every repo here releases through semantic-release, so an
# unprefixed subject both trips VER-001 and cuts no release — the fix
# would land on main and never reach the registry.
#
# Version updates arrive as at most two pull requests per ecosystem,
# because a failing bump is easiest to fix when it is not tangled with
# unrelated ones:
#   - `majors`: every third-party major in one pull request. Majors are
#     what break tests; keeping them together and apart from routine bumps
#     means routine bumps never wait on a migration. If one major is hard,
#     `@dependabot ignore <dependency> major version` on the pull request
#     drops it and lets the rest through.
#   - `minor-and-patch`: everything else.
#
# Dependabot checks once a week, on Sunday. The cooldown holds third-party
# releases until they are a week old, so a release that gets yanked in its
# first days never reaches us.
#
# GitHub Actions stay in their own pull request so they keep the
# `ci(deps)` prefix, which cuts no release.
#
# `target-branch` points version updates at `dev`, not `main`. An upgrade
# should land where it can be exercised before a release cuts: `dev`
# publishes to the Cloudflare preview URL and to the Railway development
# environment, so a bad bump surfaces there instead of in production.
#
# Dependabot reads this file from the *default* branch only, so this
# config has to be on `main` to take effect even though every
# version-update pull request targets `dev`.
#
# There is deliberately no security-updates entry: security fixes land on
# `dev` like every other change and reach `main` only through the
# promotion pull request (ecosystem-standards CD-034). Dependabot security
# updates cannot do that: they ignore `target-branch` and always open
# against `main`, where automerge never merges, so they are off in the
# repository settings. Dependabot alerts stay on there, as an independent
# list of open advisories.
#
# dependency-fix.yml in mini-app-polis/.github re-locks uv repositories
# only, so here the fix is made on `dev` when CI's dependency audit
# (SEC-003) flags an advisory: a bump of the direct dependency, or an entry
# under `pnpm.overrides` in package.json for a transitive one. The weekly
# version updates above keep most advisories from arising.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "sunday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      majors:
        patterns: ["*"]
        update-types: ["major"]
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(deps)"
    # TypeScript 7 is held back deliberately. 7.0 ships a native compiler
    # with no JS API, and typescript-eslint needs that API — with 7 installed
    # `eslint` exits immediately ("typescript-eslint does not support TS
    # 7.0"), failing lint on every pull request. Only >= 7 is ignored, so
    # majors below it still arrive. Remove this once typescript-eslint
    # supports 7 (typescript-eslint/typescript-eslint#10940).
    ignore:
      - dependency-name: "typescript"
        versions: [">= 7.0.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "sunday"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
